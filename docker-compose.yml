services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8888:8000"
    volumes:
      - .:/app
      - ./ai_trader_data:/app/service/server/data
    environment:
      - PYTHONPATH=/app/service/server
    env_file:
      - .env
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "service.server.worker"]
    volumes:
      - .:/app
      - ./ai_trader_data:/app/service/server/data
    environment:
      - PYTHONPATH=/app/service/server
    env_file:
      - .env
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    volumes:
      - ./service/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: always
