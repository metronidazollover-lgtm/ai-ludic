services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8888:8000"
    volumes:
      - .:/app
      - ./ai_trader_data:/app/service/server/data
    environment:
      - PYTHONPATH=/app/service/server
      - ENABLE_API_BACKGROUND_TASKS=false
    env_file:
      - .env
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "service.server.worker"]
    volumes:
      - .:/app
      - ./ai_trader_data:/app/service/server/data
    environment:
      - PYTHONPATH=/app/service/server
    env_file:
      - .env
    restart: always
